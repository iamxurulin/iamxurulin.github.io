.liquid-loader {
  display: flex;
  flex-direction: column;
  align-items: center;

  padding: 20px;

}

.loader-track {
  position: relative;
  width: 180px;
  height: 32px;
  background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6),0 1px 3px rgba(255, 255, 255, 0.1);
}

.liquid-fill {
  position: absolute;
  top: 2px;
  left: 2px;
  height: calc(100% - 4px);
  background: linear-gradient(90deg, #4f46e5, #7c3aed, #ec4899, #f59e0b);
  border-radius: 14px;
  animation: fillProgress 4s ease-out infinite, colorShift 3s linear infinite;
  box-shadow:0 0 12px rgba(124, 58, 237, 0.4),inset 0 1px 2px rgba(255, 255, 255, 0.2);
}

 
.animated-stop {
  animation-play-state: paused !important;
  -webkit-animation-play-state: paused !important;
}

.loading-text {
  color: white;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 1px;
  animation: textGlow 1s ease-in-out infinite;
}

.dot {
  margin-left: 3px;
  animation: blink 1.5s infinite;
}
.dot:nth-of-type(1) { animation-delay: 0s; }
.dot:nth-of-type(2) { animation-delay: 0.3s; }
.dot:nth-of-type(3) { animation-delay: 0.6s; }

@keyframes fillProgress {
  0% { width: 4px; }
  25% { width: 25%; }
  50% { width: 50%; }
  75% { width: 75%; }
  100% { width: calc(100% - 4px); }
}
@keyframes colorShift {
  0% { filter: hue-rotate(0deg) brightness(1); }
  33% { filter: hue-rotate(120deg) brightness(1.1); }
  66% { filter: hue-rotate(240deg) brightness(0.9); }
  100% { filter: hue-rotate(360deg) brightness(1); }
}
@keyframes textGlow {
  0%,100% { opacity: 0.7;text-shadow: 0 0 8px rgba(139, 92, 246, 0.3); }
  50% { opacity: 1;text-shadow: 0 0 16px rgba(139, 92, 246, 0.6); }
}
@keyframes blink {
  0%,50% { opacity: 1; }
  51%,100% { opacity: 0; }
}

 
@keyframes scaleAndFadeout {

<script>	
    function initLoading() {
        const isFirstVisit = !sessionStorage.getItem('visited');
        if (isFirstVisit) {
            const loading = document.querySelector(".loading");
            const liquidFill = document.querySelector(".liquid-fill"); 
            loading.style.display = "flex";
            
            
            setTimeout(() => {
                loadFinish(loading, liquidFill);
                
                setTimeout(() => {
                    loading.style.display = "none";
                }, 1500);
                
                sessionStorage.setItem('visited', 'true');
            }, 4000); 
        }
    }
	
    function loadFinish(loading, liquidFill) {
        
        liquidFill.classList.add("animated-stop");
        
        loading.classList.add("scaleAndFadeout");
    }
	
    
    initLoading();
</script>

    apScript.onload = function() {
        const ap = new APlayer({
            container: document.getElementById('aplayer'),
            fixed: true,
            lrcType: 3,
            audio: [
                
                {
                    name: '远行',
                    artist: '大青山',
                    url: '\/music\/大青山-远行.mp3',
                    cover: '\/music\/cover.jpg',
                    lrc: '\/music\/大青山-远行-歌词.lrc'
                }
                
            ]
        });

        window.onbeforeunload = () => {
            const playInfo = {
                index: ap.list.index,
                currentTime: ap.audio.currentTime,
                paused: ap.paused
            };
            localStorage.setItem("playInfo", JSON.stringify(playInfo));
        };

        const playInfo = JSON.parse(localStorage.getItem("playInfo"));
        if (playInfo) {
            ap.list.switch(playInfo.index);
            setTimeout(() => {
                ap.seek(playInfo.currentTime);
                if (!playInfo.paused) ap.play();
            }, 500);
        }
    };
    document.head.appendChild(apScript);
};

if (window.requestIdleCallback) {
    requestIdleCallback(window._aplayerInit, { timeout: 3000 });
} else {
    setTimeout(window._aplayerInit, 2000);
}

<script>
  function initCodeMoreBox() {
    const codeBlocks = document.querySelectorAll(".highlight:not(.code-inited)");
    
    codeBlocks.forEach(codeBlock => {
      
      codeBlock.classList.add("code-inited");

      
      if (codeBlock.scrollHeight <= codeBlock.clientHeight + 5) { 
        return;
      }

      
      const codeMoreBox = document.createElement('div');
      codeMoreBox.classList.add('code-more-box');

      const codeMoreBtn = document.createElement('span');
      codeMoreBtn.classList.add('code-more-btn');
      codeMoreBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        codeBlock.classList.add('code-show');
        codeMoreBox.style.display = 'none';
        
        window.dispatchEvent(new Event('resize'));
      });

      const img = document.createElement('img');
      img.classList.add('code-more-img');
      img.src = "https://iamxurulin.github.io/icons/codeMore.png";
      img.alt = "展开代码";

      codeMoreBtn.appendChild(img);
      codeMoreBox.appendChild(codeMoreBtn);
      codeBlock.appendChild(codeMoreBox);
    });
  }

  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCodeMoreBox);
  } else {
    initCodeMoreBox();
  }

  
  document.addEventListener('pjax:complete', initCodeMoreBox);
  document.addEventListener('swup:contentReplaced', initCodeMoreBox); 
  window.addEventListener('popstate', initCodeMoreBox); 

  
  const observer = new MutationObserver((mutations) => {
    let shouldRun = false;
    mutations.forEach(mutation => {
      if (mutation.addedNodes.length) {
        shouldRun = true;
      }
    });
    if (shouldRun) {
      
      setTimeout(initCodeMoreBox, 100);
    }
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
</script>

    const config = {
        path: {
            homePath: "/",
            modelPath: cdnPath + "/Resources/",

            live2dCorePath: cdnPath + "/Core/live2dcubismcore.js",

            cssPath: "https://iamxurulin.github.io/waifu/waifu.css",
            tipsJsonPath: "https://iamxurulin.github.io/waifu/waifu-tips.json"
        },
        tools: ["hitokoto", "asteroids", "express", "photo", "info", "quit"],
        drag: { enable: true, direction: ["x", "y"] }
    };

    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = config.path.cssPath;
    document.head.appendChild(css);

    function loadScript(url) {
        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = url;
            s.async = true;
            s.onload = () => resolve(url);
            s.onerror = () => reject(new Error('Failed to load ' + url));
            document.head.appendChild(s);
        });
    }

    loadScript(config.path.live2dCorePath)
        .then(() => loadScript(config.path.live2dSdkPath))
        .then(() => loadScript(config.path.tipsJsPath))
        .then(() => {
            localStorage.setItem("modelId", "0");
            localStorage.setItem("modelTexturesId", "0");
            initWidget({
                waifuPath: config.path.tipsJsonPath,
                cdnPath: config.path.modelPath,
                tools: config.tools,
                dragEnable: config.drag.enable,
                dragDirection: config.drag.direction,
            });
        })
        .catch(e => console.warn('Live2D load failed:', e));
};

if (screen.width >= 768) {
    if (window.requestIdleCallback) {
        requestIdleCallback(window._live2dInit, { timeout: 6000 });
    } else {
        setTimeout(window._live2dInit, 4000);
    }
}
</script>
